# Mono-repo CI (ADR-0010, #74). Runs on EVERY PR with NO path filter: the
# front-end tsconfig aliases into backend/.../bindings, so a back-end entity
# change regenerates bindings and must re-run the front-end type-check. A
# FE-only PR still runs the BE job, and vice-versa.
#
# DB backend is Postgres only. The {turso, postgres} DB matrix and the SQLite
# self-booting e2e (ADR-0010/#74 wording) belong to the Turso DB-swap track,
# split out of #17 into #79 (seam #80, e2e self-boot #81) and land there — this
# workflow closes the mono-repo merge on the existing Postgres DB.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Daily security re-scan (#139): a freshly disclosed RustSec advisory can trip
  # an unchanged Cargo.lock, so the cargo-audit job runs on a schedule too. Only
  # the security jobs run on this trigger; every other job is guarded with
  # `if: github.event_name != 'schedule'` so the full CI matrix stays PR/push-only.
  schedule:
    - cron: "17 6 * * *"

# One in-flight run per ref, per event; newer pushes cancel older runs.
# `github.event_name` is in the key so a scheduled run and a push to main (both
# on refs/heads/main) do not share a group and cancel each other (#139).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # -- Front-end: check (no --fix), test, build. Uses `vp` (not `vpr check`,
  #    which would --fix in CI) per ADR-0010. Bins come from the local
  #    vite-plus install after `bun install`.
  frontend:
    name: Front-end (vp check / test / build)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Expose local bins (vp, vinxi) on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Format + lint + type-check (no --fix)
        run: vp check

      - name: Unit + component tests
        run: vp test

      - name: Production build
        run: vinxi build

  # -- Back-end: fmt/clippy/build/nextest against a Postgres 17 service. The
  #    tests seed the DB via _dev_utils::init_dev_db (SERVICE_DB_URL and the
  #    dev SQL are wired through backend/.cargo/config.toml).
  backend:
    name: Back-end (fmt / clippy / build / nextest — postgres)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: welcome
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: nextest

      # Mirrors `cgs check` (fmt) but in check-mode: CI must not mutate.
      - name: Format check
        run: cargo fmt --all --check

      # Mirrors `cgs check` lint (backend/Scripts.toml), gated on warnings: the
      # tree is warning-clean, so `-D warnings` fails CI on any new clippy
      # warning. See the `-D warnings` note in the root Cargo.toml.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Mirrors `cgs build`.
      - name: Build
        run: cargo build

      # Mirrors `cgs test`; touches Postgres (init_dev_db + model tests).
      - name: Tests
        run: cargo nextest run -j1

  # -- Bindings-drift guard (ADR-0010): regenerate ts-rs bindings, then fail if
  #    the committed copies lag the Rust types. ts-rs export tests need no DB.
  bindings-drift:
    name: Bindings drift guard
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      # Equivalent to `cgs bindings` (backend/Scripts.toml: cargo test
      # export_bindings); TS_RS_EXPORT_DIR is set in backend/.cargo/config.toml.
      - name: Regenerate bindings
        working-directory: backend
        run: cargo test export_bindings

      - name: Verify committed bindings are up to date
        run: git diff --exit-code -- backend/crates/services/web-server/bindings

      - name: Explain drift
        if: failure()
        run: |
          echo "::error::Committed ts-rs bindings lag the Rust types."
          echo "Run 'cgs bindings' (in backend/) and commit the changes."

  # -- ADR index guard: docs/adr/README.md is generated from the ADR files, so
  #    fail if it lags. Mirrors `cgs adr:index:check` (root Scripts.toml) with the
  #    underlying script, per the CI convention above — no cargo/cgs, no DB.
  adr-index:
    name: ADR index guard
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify docs/adr/README.md is current
        run: ./scripts/adr-index.sh check

      - name: Explain drift
        if: failure()
        run: |
          echo "::error::docs/adr/README.md lags the ADR files."
          echo "Run 'cgs adr:index' (from the repo root) and commit docs/adr/README.md."

  # -- SBOM drift guard (ADR-0022, #138): regenerate the project-wide CycloneDX
  #    SBOM and fail if the committed /sbom.cdx.json lags the lockfiles. Mirrors
  #    the bindings-drift / adr-index guards. syft is PINNED in scripts/sbom.sh
  #    (the single pin): the script downloads that release, verifies its sha256,
  #    and runs it, so the runner and a developer machine use the same version.
  #    The front-end needs bun because sbom.sh derives a yarn.lock from bun.lock
  #    (syft's bun.lock reader is unreliable).
  sbom-drift:
    name: SBOM drift guard
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      # sbom.sh runs `bun install --frozen-lockfile --yarn`; prime the cache.
      - name: Install front-end dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Equivalent to `cgs sbom:check`; must run before the determinism test,
      # which overwrites /sbom.cdx.json in the checkout.
      - name: Verify /sbom.cdx.json is current
        run: ./scripts/sbom.sh check

      - name: Prove determinism + ecosystem coverage
        run: ./scripts/sbom.test.sh

      - name: Explain drift
        if: failure()
        run: |
          echo "::error::/sbom.cdx.json lags the dependency lockfiles."
          echo "Run 'cgs sbom' (from the repo root) and commit /sbom.cdx.json."

  # -- Project-wide vulnerability gate (#142, ADR-0022): grype scans the
  #    committed /sbom.cdx.json (Rust + TypeScript in one pass) and fails on high
  #    or critical findings. syft inventories; grype gates. This job scans the
  #    COMMITTED SBOM, not a freshly generated one — the `sbom-drift` job above
  #    already proves the committed SBOM matches the lockfiles, so a stale SBOM
  #    cannot hide a finding here. Runs on every PR, on push to main, AND on the
  #    daily schedule: grype auto-updates its vulnerability DB each run, so the
  #    scheduled run surfaces a newly disclosed CVE in an unchanged dependency.
  #    Like cargo-audit, this job carries no `if:` guard. Mirrors `cgs scan`.
  #    grype is PINNED so its behaviour is reproducible; the DB it downloads is
  #    always current regardless of the pinned binary.
  grype-scan:
    name: grype (project-wide vulnerability gate)
    if: github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    env:
      GRYPE_VERSION: v0.119.0
      # sha256 of grype_<version>_linux_amd64.tar.gz from the release's
      # grype_<version>_checksums.txt. Bump both together on a version change.
      GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install grype from its pinned GitHub release and verify the tarball's
      # sha256 BEFORE running it, rather than piping the mutable
      # get.anchore.io/grype installer straight to `sh`. A compromised installer
      # endpoint therefore cannot execute arbitrary code in the runner: the job
      # fails unless the download matches the pinned checksum above.
      - name: Install grype (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          tarball="grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/${tarball}" -o "$tarball"
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" grype
          sudo install -m 0755 grype /usr/local/bin/grype
          rm -f "$tarball" grype
          grype version

      # Mirrors `cgs scan`: grype over /sbom.cdx.json with --fail-on high. The
      # script maps grype's exit codes (2 = findings, 100 = DB upgrade, other =
      # tool error) so a finding fails the build and a tool error does not pass
      # silently. It also passes the committed /vex.openvex.json via --vex, so a
      # finding recorded `not_affected` (e.g. esbuild GHSA-67mh-4wv8-2f99) is
      # ignored with its justification rather than gating.
      - name: Scan the committed SBOM (fails on high/critical)
        run: ./scripts/grype-scan.sh

      # Proves the gate: a planted high/critical finding fails, a clean SBOM
      # passes. Uses fixture SBOMs, not /sbom.cdx.json, so it does not flap as
      # new CVEs are disclosed.
      - name: Prove gate behaviour (planted finding / clean SBOM)
        run: ./scripts/grype-scan.test.sh

      # Mirrors `cgs vex:check`: fail if any VEX statement no longer matches a
      # current finding (a stale/orphaned suppression — the dependency was fixed
      # or its version moved). Keeps /vex.openvex.json honest as deps change.
      - name: Verify VEX statements are not stale
        run: ./scripts/vex-check.sh

      # Proves the guard: a statement matching a live finding passes, an orphan fails.
      - name: Prove VEX guard behaviour (live / orphan)
        run: ./scripts/vex-check.test.sh

      # Proves the pre-push hook wrapper (#143): it forces grype offline
      # (GRYPE_DB_AUTO_UPDATE=false) and a finding blocks the push. The hook is a
      # local convenience gate; this job is the real enforcement.
      - name: Prove pre-push gate behaviour (offline / blocks / passes)
        run: ./scripts/pre-push-scan.test.sh

  # -- Back-end RustSec gate (#139, ADR-0022): cargo-audit scans backend/Cargo.lock
  #    against the RustSec advisory database. `--deny warnings` fails on ANY
  #    advisory, including the RustSec-only signals grype does not carry
  #    (unmaintained / unsound / notice / yanked). Accepted risks live in
  #    backend/.cargo/audit.toml. Runs on every PR, on push to main, and on the
  #    daily schedule (a fresh advisory can trip an unchanged Cargo.lock): this
  #    job carries no `if:` guard. Mirrors `cgs audit`.
  cargo-audit:
    name: cargo-audit (back-end RustSec)
    if: github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-audit

      # Mirrors `cgs audit` (backend/Scripts.toml). Fetches the advisory DB, then
      # fails on any advisory not accepted in backend/.cargo/audit.toml.
      - name: Audit (fails on any advisory)
        working-directory: backend
        run: cargo audit --deny warnings

      # Proves the gate: an advisory trips it, a clean lockfile passes, an
      # unmaintained advisory is caught, and an accepted advisory is ignored.
      - name: Prove gate behaviour (advisory / clean / unmaintained / ignore-list)
        run: ./scripts/cargo-audit.test.sh

  # -- Back-end dependency-policy gate (#140, ADR-0022): cargo-deny enforces the
  #    license allow-list, crate bans, and source rules in backend/deny.toml.
  #    Scope is `licenses bans sources` — NOT `advisories`, which is the separate
  #    cargo-audit gate (#139); running it here would need a second RustSec
  #    ignore-list. These checks change only when the lockfile changes, so unlike
  #    cargo-audit this job needs no daily schedule: it is guarded PR/push-only.
  #    Mirrors `cgs deny`.
  cargo-deny:
    name: cargo-deny (back-end dependency policy)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      # cargo-deny is PINNED: a new version can change lint output or defaults,
      # so the runner must match the version the policy was written against.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-deny@0.20.2

      # Mirrors `cgs deny` (backend/Scripts.toml). Fails on a disallowed license,
      # a banned crate, or an untrusted source.
      - name: Deny (licenses / bans / sources)
        working-directory: backend
        run: cargo deny check licenses bans sources

      # Proves the gate: a banned crate fails, a disallowed license fails, an
      # untrusted source fails, and the real policy passes on a clean tree.
      - name: Prove gate behaviour (banned crate / disallowed license / source / clean)
        run: ./scripts/cargo-deny.test.sh

  # -- Back-end unused-dependency report (#141, ADR-0022): cargo-udeps lists
  #    dependencies declared in a Cargo.toml but never compiled in. It needs a
  #    NIGHTLY toolchain (it reads unstable compiler dep-info). REPORT-ONLY —
  #    `continue-on-error` surfaces findings without blocking merge. Two reasons
  #    it does not gate: (1) it runs on nightly, whose output drifts on its own
  #    schedule, and (2) cargo-udeps itself warns a finding "might be
  #    false-positive" (a dep used only in a doc-test or via a macro). The hard
  #    dependency gates are cargo-deny (#140) and cargo-audit (#139). Findings
  #    change only with the lockfile/manifests, so this job is guarded
  #    PR/push-only. Mirrors `cgs udeps`.
  cargo-udeps:
    name: cargo-udeps (unused dependencies — report-only)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned dtolnay/rust-toolchain commit as the other jobs; the
      # `toolchain: nightly` input selects the channel (cargo-udeps needs
      # nightly). Pin the commit AND name the channel — the ref name alone would
      # otherwise decide the channel.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      # cargo-udeps is PINNED for reproducibility. Bump it if a newer nightly
      # stops it building — it links cargo's own internals.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-udeps@0.1.61

      # Mirrors `cgs udeps` (backend/Scripts.toml). Report-only, but a real tool
      # failure must not masquerade as success: pass only when cargo-udeps
      # actually produced a report. It exits 0 when clean, or 1 with an "unused
      # dependencies:" list on a finding — both are a report, so the step stays
      # green. Any other non-zero exit (nightly drift, a compile error) prints no
      # list, so the step fails and the crash is visible. `continue-on-error`
      # above keeps even that failure from blocking merge. ANSI is stripped
      # because CARGO_TERM_COLOR=always can colour the marker.
      - name: Report unused dependencies
        working-directory: backend
        run: |
          if out="$(cargo +nightly udeps --workspace --all-targets 2>&1)"; then rc=0; else rc=$?; fi
          echo "$out"
          clean="$(printf '%s' "$out" | sed $'s/\x1b\\[[0-9;]*m//g')"
          if [ "$rc" -eq 0 ] || grep -q "unused dependencies:" <<<"$clean"; then
            echo "cargo-udeps produced a report (report-only; a finding does not gate)."
          else
            echo "::error::cargo-udeps produced no report (exit $rc) — likely a tool or toolchain failure."
            exit 1
          fi

  # -- Back-end release-binary embedding (#141, ADR-0022): cargo-auditable builds
  #    the release binary with its dependency list embedded, so a shipped binary
  #    can be audited after the fact (`cargo audit bin`). This is a BUILD
  #    INTEGRATION, not a gate: the job fails only if the shipped binary lacks
  #    the embedded data. It never fails on an advisory — cargo-audit (#139) owns
  #    that. The embedding changes only with the lockfile, so this job is guarded
  #    PR/push-only. Mirrors `cgs release`, which now wraps `cargo auditable
  #    build --release`.
  cargo-auditable:
    name: cargo-auditable (release binary carries dependency list)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      # cargo-auditable writes the embedded section; cargo-audit reads it back.
      # cargo-auditable is PINNED for reproducibility.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-auditable@0.7.6,cargo-audit

      # Mirrors the build in `cgs auditable`: build the shipped web-server
      # binary with its dependency list embedded (`cgs release` embeds the same
      # way, over the whole workspace).
      - name: Build release with embedded dependency data
        working-directory: backend
        run: cargo auditable build --release -p web-server

      # Assert the binary carries the list. Grep the marker, not the exit code:
      # `cargo audit bin` also exits non-zero on an advisory, which is the
      # separate cargo-audit gate's concern, not this one. Strip ANSI first:
      # CARGO_TERM_COLOR=always makes cargo-audit write a colour reset inside the
      # marker ("Found\e[0m 'cargo auditable' data"), which breaks a literal grep.
      - name: Verify the release binary carries its dependency list
        working-directory: backend
        run: |
          report="$(cargo audit bin target/release/web-server 2>&1 | sed $'s/\x1b\\[[0-9;]*m//g')" || true
          echo "$report"
          grep -q "Found 'cargo auditable' data" <<<"$report" || {
            echo "::error::Release binary lacks embedded cargo-auditable data."
            exit 1
          }

      # Proves the tool distinguishes an embedded binary from a plain one.
      - name: Prove embedding behaviour (auditable vs plain build)
        run: ./scripts/cargo-auditable.test.sh

  # -- Back-end unsafe-code report (#141, ADR-0022): cargo-geiger counts `unsafe`
  #    usage across the crate graph. REPORT-ONLY (`continue-on-error`): the
  #    workspace crates already forbid unsafe (`unsafe_code = "forbid"` in
  #    backend/Cargo.toml [workspace.lints.rust]), so our own code is unsafe-free
  #    by compiler enforcement. geiger's value is visibility into the dependency
  #    tree's unsafe, which we do not control and cannot gate on. Findings change
  #    only with the lockfile, so this job is guarded PR/push-only. cargo-geiger
  #    is not in taiki-e/install-action, so it is `cargo install`ed and PINNED.
  #    It runs from the web-server package dir: geiger 0.12 rejects the virtual
  #    workspace manifest (backend/Cargo.toml has no [package]). Mirrors `cgs
  #    geiger`.
  cargo-geiger:
    name: cargo-geiger (unsafe-code report — report-only)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      # No Swatinem/rust-cache here on purpose. That action prunes the registry
      # `src/` (re-extractable from the .crate archives), but cargo-geiger reads
      # crate source files directly to count `unsafe`. A restored cache can then
      # miss a crate's `src/lib.rs` and the scan fails (seen: tinyvec_macros
      # NotFound). A fresh, complete registry keeps this report-only job reliable.
      - name: Install cargo-geiger (pinned)
        run: cargo install cargo-geiger --version 0.12.0 --locked

      # Mirrors `cgs geiger` (backend/Scripts.toml). Report-only, but a real tool
      # failure must not masquerade as success: pass only when cargo-geiger
      # actually produced its report. geiger exits non-zero even on a good run
      # (it counts build warnings as errors), so the exit code cannot signal
      # success — the presence of the report header ("Metric output format") does.
      # No header means geiger never scanned (a build/tool failure), so the step
      # fails and the crash is visible; `continue-on-error` above keeps that from
      # blocking merge. ANSI is stripped because CARGO_TERM_COLOR=always can
      # colour the output.
      - name: Report unsafe-code usage
        working-directory: backend/crates/services/web-server
        run: |
          if out="$(cargo geiger 2>&1)"; then :; else :; fi
          echo "$out"
          clean="$(printf '%s' "$out" | sed $'s/\x1b\\[[0-9;]*m//g')"
          if grep -q "Metric output format" <<<"$clean"; then
            echo "cargo-geiger produced a report (report-only)."
          else
            echo "::error::cargo-geiger produced no report — likely a build or tool failure."
            exit 1
          fi

  # -- End-to-end (Playwright). Non-blocking at first (ADR-0010/#74): the job
  #    boots the Postgres BE itself and runs the FE e2e suite, but
  #    continue-on-error keeps a failure from blocking merge. #81 replaces this
  #    with the self-booting `cgs test:e2e` on the Turso track.
  e2e:
    name: e2e (non-blocking)
    if: github.event_name != 'schedule' && github.head_ref != 'deps/weekly-update'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: welcome
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install front-end dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Expose local bins (vinxi, playwright) on PATH
        working-directory: frontend
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Playwright browser
        working-directory: frontend
        run: playwright install --with-deps chromium

      # main() runs _dev_utils::init_dev (seeds app_db + demo1) then binds
      # 127.0.0.1:8080; env comes from backend/.cargo/config.toml.
      - name: Boot back-end
        working-directory: backend
        run: nohup cargo run -p web-server > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for back-end (401 NO_AUTH on /api/rpc)
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s -X POST http://localhost:8080/api/rpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"test","params":{}}' || true)
            echo "$body" | grep -q "NO_AUTH" && { echo "Back-end up."; exit 0; }
            sleep 2
          done
          echo "Back-end did not become ready in time." >&2
          tail -n 50 "$RUNNER_TEMP/backend.log" || true
          exit 1

      - name: Build front-end
        working-directory: frontend
        run: vinxi build

      - name: Start front-end
        working-directory: frontend
        run: nohup vinxi start > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for front-end (port 3000)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && { echo "Front-end up."; exit 0; }
            sleep 0.5
          done
          echo "Front-end did not become ready in time." >&2
          exit 1

      - name: Run Playwright e2e
        working-directory: frontend
        run: playwright test --project=chromium
