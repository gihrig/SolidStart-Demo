# Weekly dependency updater (project-local automation, no OS cron).
#
# This is the in-repo equivalent of "cron + cgs update + tests": GitHub runs the
# cron, the job runs the updates and the full gate, and it opens a PR ONLY when
# the gate is green. A broken update fails the job and opens no PR, so a bad bump
# never reaches a reviewable branch.
#
# Self-contained by design: it runs the gate here rather than relying on ci.yml
# to run on the resulting PR. A PR opened with the default GITHUB_TOKEN does NOT
# trigger other workflows (GitHub's recursion guard), so ci.yml would not run on
# it without a PAT. Running the gate here needs no PAT and no extra secret.
#
# Steps mirror ci.yml's raw commands (the repo runs `cgs` locally; CI has no
# `cgs` binary). `cgs update` == `cargo update` (back-end) + `bun update`
# (front-end). Keep these in step with ci.yml if that workflow's gate changes.
name: Weekly deps

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC
  workflow_dispatch: {}     # also runnable on demand from the Actions tab

permissions:
  contents: write        # push the update branch
  pull-requests: write   # open the PR

concurrency:
  group: deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update deps, gate, open PR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: welcome
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: backend

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest,cargo-audit,cargo-deny@0.20.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # Pin Node: the `vp` launcher runs on Node (`#!/usr/bin/env node`), including
      # `prepare: vp config` during `bun install`. vite-plus 1.0 needs
      # ^22.18.0 || ^24.11.0 || >=26.0.0; pin it rather than inherit the runner's.
      # frontend/.node-version is the single pin (the Vite+ `node` shim reads it locally).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      # -- Updates (== `cgs update`).
      - name: Update back-end deps (cargo update)
        working-directory: backend
        run: cargo update

      - name: Update front-end deps (bun update; also installs node_modules)
        working-directory: frontend
        run: bun update

      - name: Expose local bins (vp, vinxi) on PATH
        working-directory: frontend
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Lockfiles changed, so the committed SBOM is now stale. Regenerate it so
      # the PR is mergeable (ci.yml's sbom-drift guard runs on push/merge).
      # sbom.sh fetches its pinned, checksum-verified syft (same as ci.yml).
      - name: Regenerate SBOM
        run: ./scripts/sbom.sh write

      # -- Security gate (mirrors ci.yml's cargo-audit, cargo-deny and grype-scan
      #    jobs, which skip this PR; #225). Runs first: it needs only the
      #    lockfiles and the regenerated SBOM, so a vulnerable bump fails fast.
      - name: Back-end audit (fails on any advisory)
        working-directory: backend
        run: cargo audit --deny warnings

      - name: Back-end deny (licenses / bans / sources)
        working-directory: backend
        run: cargo deny check licenses bans sources

      - name: Install grype (pinned release, checksum-verified)
        run: ./scripts/grype-install.sh

      - name: Scan the regenerated SBOM (fails on high/critical)
        run: ./scripts/grype-scan.sh

      - name: Verify VEX statements are not stale
        run: ./scripts/vex-check.sh

      # -- Gate (mirrors ci.yml). A failure here fails the job -> no PR opens.
      - name: Back-end format check
        working-directory: backend
        run: cargo fmt --all --check

      - name: Back-end clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Back-end build
        working-directory: backend
        run: cargo build

      - name: Back-end tests (Postgres)
        working-directory: backend
        run: cargo nextest run -j1

      - name: Front-end check (no --fix)
        working-directory: frontend
        run: vp check

      - name: Front-end tests
        working-directory: frontend
        run: vp test

      - name: Front-end build
        working-directory: frontend
        run: vinxi build

      # `bun update` above runs frontend/package.json's `prepare` (`vp config`),
      # which points core.hooksPath at the Vite+ hooks (pre-commit, pre-push).
      # The hooks are a local developer convenience; the security gate steps
      # above already scanned this SBOM. Disable local hooks so they cannot
      # block the create-pull-request commit or push.
      - name: Disable local git hooks for the automated push
        run: |
          mkdir -p "$RUNNER_TEMP/no-hooks"
          git config core.hooksPath "$RUNNER_TEMP/no-hooks"

      # -- Open the PR. No-op when the updates produced no file changes.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/weekly-update
          delete-branch: true
          commit-message: "chore(deps): weekly cgs update"
          title: "chore(deps): weekly cgs update"
          body: |
            Automated weekly dependency update (`.github/workflows/deps.yml`).

            - `cargo update` (back-end) + `bun update` (front-end)
            - `/sbom.cdx.json` regenerated for the lockfile bumps
            - Full gate passed in the workflow: security (cargo audit
              --deny warnings, cargo deny check licenses bans sources,
              grype --fail-on high, VEX check), back-end
              fmt/clippy/build/nextest and front-end check/test/build. This PR
              was opened only because the gate was green.
            - Advisories published after this run are not covered. Before
              merging, run `cgs audit` and `cgs scan` locally.
