# Weekly dependency updater (project-local automation, no OS cron).
#
# This is the in-repo equivalent of "cron + cgs update + tests": GitHub runs the
# cron, the job runs the updates and the full gate, and it opens a PR ONLY when
# the gate is green. A broken update fails the job and opens no PR, so a bad bump
# never reaches a reviewable branch.
#
# Self-contained by design: it runs the gate here rather than relying on ci.yml
# to run on the resulting PR. A PR opened with the default GITHUB_TOKEN does NOT
# trigger other workflows (GitHub's recursion guard), so ci.yml would not run on
# it without a PAT. Running the gate here needs no PAT and no extra secret.
#
# Steps mirror ci.yml's raw commands (the repo runs `cgs` locally; CI has no
# `cgs` binary). `cgs update` == `cargo update` (back-end) + `bun update`
# (front-end). Keep these in step with ci.yml if that workflow's gate changes.
name: Weekly deps

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC
  workflow_dispatch: {}     # also runnable on demand from the Actions tab

permissions:
  contents: write        # push the update branch
  pull-requests: write   # open the PR

concurrency:
  group: deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update deps, gate, open PR
    runs-on: ubuntu-latest
    env:
      SYFT_VERSION: v1.51.1   # pinned; must match the sbom-drift job in ci.yml
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: welcome
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: nextest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install syft (pinned; for the SBOM regen below)
        run: curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin "$SYFT_VERSION"

      # -- Updates (== `cgs update`).
      - name: Update back-end deps (cargo update)
        working-directory: backend
        run: cargo update

      - name: Update front-end deps (bun update; also installs node_modules)
        working-directory: frontend
        run: bun update

      - name: Expose local bins (vp, vinxi) on PATH
        working-directory: frontend
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Lockfiles changed, so the committed SBOM is now stale. Regenerate it so
      # the PR is mergeable (ci.yml's sbom-drift guard runs on push/merge).
      - name: Regenerate SBOM
        run: ./scripts/sbom.sh write

      # -- Gate (mirrors ci.yml). A failure here fails the job -> no PR opens.
      - name: Back-end format check
        working-directory: backend
        run: cargo fmt --all --check

      - name: Back-end clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Back-end build
        working-directory: backend
        run: cargo build

      - name: Back-end tests (Postgres)
        working-directory: backend
        run: cargo nextest run -j1

      - name: Front-end check (no --fix)
        working-directory: frontend
        run: vp check

      - name: Front-end tests
        working-directory: frontend
        run: vp test

      - name: Front-end build
        working-directory: frontend
        run: vinxi build

      # `bun update` above runs frontend/package.json's `prepare`
      # (`vp config`), which points core.hooksPath at the Vite+ hooks — including
      # the pre-push grype gate. grype is not installed on this runner, so that
      # hook would block the create-pull-request push (exit 127 -> gate fails).
      # The hook is a local developer convenience; ci.yml's `grype-scan` job
      # enforces the gate on the resulting PR. Disable local hooks for the push.
      - name: Disable local git hooks for the automated push
        run: |
          mkdir -p "$RUNNER_TEMP/no-hooks"
          git config core.hooksPath "$RUNNER_TEMP/no-hooks"

      # -- Open the PR. No-op when the updates produced no file changes.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/weekly-update
          delete-branch: true
          commit-message: "chore(deps): weekly cgs update"
          title: "chore(deps): weekly cgs update"
          body: |
            Automated weekly dependency update (`.github/workflows/deps.yml`).

            - `cargo update` (back-end) + `bun update` (front-end)
            - `/sbom.cdx.json` regenerated for the lockfile bumps
            - Full gate passed in the workflow: back-end fmt/clippy/build/nextest
              and front-end check/test/build. This PR was opened only because the
              gate was green.
